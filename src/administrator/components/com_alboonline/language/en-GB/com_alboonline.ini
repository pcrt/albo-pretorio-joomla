; Scheduled tasks (M37) — without them the act lifecycle never happens.
; NOTE: these two labels must match EXACTLY the routine names shown in
; System → Scheduled Tasks → New (task plugin language file), otherwise the warning
; sends the officer looking for something that does not exist in the list.
COM_ALBOONLINE_TASK_LOCK="Albo Pretorio - Blocca Atti Pubblicati"
COM_ALBOONLINE_TASK_ARCHIVE="Albo Pretorio - Archivia Atti Scaduti"
COM_ALBOONLINE_WARNING_TASK_MANCANTE="Scheduled task missing or disabled: «%s». Without it the act lifecycle does not happen: published acts never become visible to citizens (sealing), or they are never withdrawn at expiry and no publication certificate is issued (archiving). Create it under System → Scheduled Tasks → New, choosing the task type with that name."
COM_ALBOONLINE_TASK_CREATI="Scheduled tasks created automatically: «%s». These are the jobs that make acts public when the buffer expires and withdraw them at the end of the publication period, issuing the certificate. You will find them under System → Scheduled Tasks. IMPORTANT: for them to actually run, the site needs a way to execute them. With the «lazy scheduler» (Joomla's default) they only run when someone visits the site: on a rarely visited notice board an act may stay «Pending» for hours. A system cron is recommended for a legal notice board."
COM_ALBOONLINE_TASK_CREAZIONE_FALLITA="The scheduled task «%s» could not be created automatically. The component still works, but until that job exists acts will not complete their lifecycle. Create it manually under System → Scheduled Tasks → New."

; Field descriptions: only where getting it wrong has a consequence
COM_ALBOONLINE_FIELD_OGGETTO_DESC="Summary of the act's content. It is public: citizens read it in the notice board list. It is also the text the system scans for terms indicating special categories of data (health, judicial, minors) in order to warn you before publication."
COM_ALBOONLINE_FIELD_CATEGORY_DESC="It only CLASSIFIES the act and makes it findable in the category tree. It does NOT restrict who can see it: an act published on the notice board is readable by anyone, even if the category is restricted. If a content must not be public, it must not be published on the notice board."
COM_ALBOONLINE_FIELD_TIPO_ATTO_DESC="It determines the publication DURATION: each type has its own number of days, set in the Options. The duration is a legal minimum — you may publish for longer, never for less."
COM_ALBOONLINE_FIELD_RESPONSABILE_DESC="Who is accountable for the publication. It is printed on the certificate and on the register: it is the name the authority produces if anyone challenges when and for how long the act was published."
COM_ALBOONLINE_FIELD_DATA_ATTO_DESC="The date of the ACT itself (the one written on the document), not the publication date. They are different: publication starts when you press «Publish»."
COM_ALBOONLINE_FIELD_PUBLISH_UP_DESC="Certain start date of publication: the citizen's appeal terms run from here. The system sets it when you publish — it cannot be edited by hand, and that is precisely why it holds as evidence."
COM_ALBOONLINE_CONFIG_HELPURL="Help URL (Help button)"
COM_ALBOONLINE_CONFIG_HELPURL_DESC="The toolbar «Help» button belongs to Joomla and, by default, opens Joomla's own online help — of little use to those publishing acts. Set a URL here (your authority's guide, or the component's) and the button will open that instead. Leave empty if you have no guide: a generic help is better than a broken link."

; Chiavi che esistevano solo in italiano: su un Joomla in inglese le Opzioni mostravano il
; codice grezzo (COM_ALBOONLINE_CONFIG_TIPI_ATTO) invece dell'etichetta. L'en-GB non e' una
; lingua che curiamo — il prodotto e' per la PA italiana — ma e' la RETE: Joomla carica
; sempre prima la lingua predefinita e poi ci sovrascrive l'italiano, quindi una chiave
; assente qui diventa un codice a schermo. Una rete con i buchi non e' una rete.
