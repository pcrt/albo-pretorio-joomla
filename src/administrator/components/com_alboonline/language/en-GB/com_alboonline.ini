; Robots / indexing
COM_ALBOONLINE_CONFIG_CARICA_BOOTSTRAP="Load Bootstrap (only if your template does not include it)"
COM_ALBOONLINE_CONFIG_CARICA_BOOTSTRAP_DESC="Leave this set to 'No' if unsure: it is the right answer in the vast majority of cases. The public notice board pages rely on the Bootstrap stylesheet, which is included in Cassiopeia (Joomla's default template) and in Bootstrap Italia based templates: in that case the notice board automatically inherits your site's look and nothing needs to be enabled. Turn this on ONLY if your template does not include Bootstrap and the list of acts appears unstyled (bare text, buttons that look like links, borderless tables). Note: the notice board remains readable, downloadable and accessible even without styling - only its appearance changes."
COM_ALBOONLINE_CONFIG_DEFAULT_ROBOTS="Search Engine Indexing"
COM_ALBOONLINE_CONFIG_DEFAULT_ROBOTS_DESC="Default indexing for acts in progress. For the notice board 'noindex' is recommended (search-engine indexing is discouraged due to the right to be forgotten, unlike the Transparency section). Each act in progress can override this; on archived acts noindex is always enforced."
COM_ALBOONLINE_CONFIG_REFERTO_FIELDSET="Publication Report"
COM_ALBOONLINE_CONFIG_REFERTO_FIELDSET_DESC="The publication report certifies that an act was published on the notice board. It is not mandated by national law: its rules (name, obligation, form) depend on each authority's own regulation. Here you can enable it and adapt its terminology."
COM_ALBOONLINE_CONFIG_REFERTO_ATTIVO="Issue the report at un-posting"
COM_ALBOONLINE_CONFIG_REFERTO_ATTIVO_DESC="If enabled, when publication ends (un-posting) the system automatically generates a frozen, sealed PDF report with the period's effective dates. The document is kept on file (not published to the public)."
COM_ALBOONLINE_CONFIG_REFERTO_TITOLO="Document name"
COM_ALBOONLINE_CONFIG_REFERTO_TITOLO_DESC="Title printed at the top of the document. Leave empty to use the default name. Some authorities use: publication relata, certificate of publication, publication notice."
COM_ALBOONLINE_CONFIG_REFERTO_SOTTOTITOLO="Subtitle / regulatory reference"
COM_ALBOONLINE_CONFIG_REFERTO_SOTTOTITOLO_DESC="Free text under the title. You may cite the article of your notice-board regulation. Leave empty if not needed. Note: we do not preset a legal reference because no national rule directly governs the report."
COM_ALBOONLINE_FIELD_ROBOTS="Indexing (robots)"
