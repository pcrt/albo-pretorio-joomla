; Diritto all'oblio
COM_ALBOONLINE_FIELD_DIRITTO_OBLIO="Diritto all'oblio"
COM_ALBOONLINE_FIELD_DIRITTO_OBLIO_DESC="Se SI, alla scadenza della pubblicazione l'atto scompare dal sito pubblico e i suoi URL restituiscono 404. I dati restano nel pannello admin. Default: NO."
; Cancellazione PDF con diritto all'oblio
COM_ALBOONLINE_CONFIG_DELETE_PDF_OBLIO="Elimina file PDF con diritto all'oblio"
COM_ALBOONLINE_CONFIG_DELETE_PDF_OBLIO_DESC="Se attivo, quando un atto con diritto all'oblio viene archiviato, i file PDF vengono eliminati fisicamente dal server. I record degli allegati restano nel database per tracciabilita'. ATTENZIONE: operazione irreversibile. Attivare solo dopo verifica normativa."
COM_ALBOONLINE_CONFIG_CATPART_ALERT="Avviso su categorie particolari di dati"
COM_ALBOONLINE_CONFIG_CATPART_ALERT_DESC="Se attivo, in redazione segnala quando l'atto potrebbe contenere dati di salute, giudiziari, su minori o di disagio economico-sociale, che all'albo vanno oscurati o non pubblicati (art. 9 GDPR). E' solo un avviso, non blocca la pubblicazione."
COM_ALBOONLINE_CATPART_TITOLO="Possibili dati particolari da verificare"
COM_ALBOONLINE_CATPART_INTRO="Il testo dell'atto contiene termini che potrebbero indicare categorie particolari di dati. Prima di pubblicare, valuta se vanno oscurati (omissis) o se l'atto va pubblicato in forma anonimizzata."
COM_ALBOONLINE_CATPART_NOTA="Rilevamento automatico e approssimato: puo' sbagliare in eccesso o in difetto. La valutazione resta di tua responsabilita' (art. 9 GDPR; art. 26 c.4 D.Lgs. 33/2013; Linee Guida Garante 2014)."
COM_ALBOONLINE_CATPART_SALUTE="Salute / disabilita'"
COM_ALBOONLINE_CATPART_GIUDIZIARI="Dati giudiziari"
COM_ALBOONLINE_CATPART_MINORI="Minori"
COM_ALBOONLINE_CATPART_DISAGIO="Disagio economico-sociale"
COM_ALBOONLINE_CONFIG_ALLEGATO_OBBLIGATORIO="Allegato obbligatorio per pubblicare"
COM_ALBOONLINE_CONFIG_ALLEGATO_OBBLIGATORIO_DESC="Se attivo (consigliato), un atto senza documento allegato non può essere pubblicato: la pubblicità legale è la pubblicazione di un documento. Disattivalo solo se l'ente pubblica avvisi il cui contenuto sta interamente nei campi testuali dell'atto."
COM_ALBOONLINE_CONFIG_CHECKLIST="Checklist prima della pubblicazione"
COM_ALBOONLINE_CONFIG_CHECKLIST_DESC="Se attivo, mostra una checklist di controllo sugli atti in bozza (minimizzazione dei dati, omissis, versione del documento). E' un promemoria, non blocca la pubblicazione."
COM_ALBOONLINE_CHECKLIST_TITOLO="Prima di pubblicare, verifica:"
COM_ALBOONLINE_CHECKLIST_INTRO="Controlli consigliati sull'atto e sugli allegati prima della pubblicazione all'albo."
COM_ALBOONLINE_CHECKLIST_1="Solo i dati necessari: nessun dato personale eccedente rispetto alla finalita' (minimizzazione, art. 5.1.c GDPR)."
COM_ALBOONLINE_CHECKLIST_2="Dati particolari oscurati (omissis): salute, giudiziari, minori, disagio economico (art. 9 GDPR)."
COM_ALBOONLINE_CHECKLIST_3="L'allegato caricato e' la versione corretta e definitiva del documento."
COM_ALBOONLINE_CHECKLIST_4="Ente emanante e, se prevista, segnatura di protocollo corretti."
COM_ALBOONLINE_CHECKLIST_5="Durata di pubblicazione adeguata alla tipologia dell'atto."
COM_ALBOONLINE_CHECKLIST_NOTA="Le spunte sono un aiuto per te e non vengono salvate. La responsabilita' della pubblicazione resta del responsabile."
; Robots / indicizzazione
COM_ALBOONLINE_CONFIG_TIPI_ATTO="Tipi di Atto"
COM_ALBOONLINE_CONFIG_TIPI_ATTO_DESC="Definisci i tipi di atto disponibili. Ogni tipo ha un valore (identificativo tecnico, solo lettere minuscole senza spazi) e un'etichetta (nome visualizzato)."
COM_ALBOONLINE_CONFIG_TIPO_VALORE="Valore"
COM_ALBOONLINE_CONFIG_TIPO_VALORE_DESC="Identificativo tecnico (solo lettere minuscole, senza spazi). Es: concorso, graduatoria"
COM_ALBOONLINE_CONFIG_TIPO_ETICHETTA="Etichetta"
COM_ALBOONLINE_CONFIG_TIPO_ETICHETTA_DESC="Nome visualizzato nel frontend e nei filtri. Es: Concorso Pubblico, Graduatoria"
COM_ALBOONLINE_CONFIG_TIPO_GIORNI="Giorni di pubblicazione"
COM_ALBOONLINE_CONFIG_TIPO_GIORNI_DESC="Durata della pubblicazione all'albo per questa tipologia di atto (in giorni). Se lasciato vuoto si applica la durata predefinita globale."
COM_ALBOONLINE_CONFIG_CARICA_BOOTSTRAP="Carica Bootstrap (solo se il tuo template non lo include)"
COM_ALBOONLINE_CONFIG_CARICA_BOOTSTRAP_DESC="Lascia 'No' se non sai cosa rispondere: nella grande maggioranza dei casi va bene cosi'. Le pagine pubbliche dell'albo si appoggiano al foglio di stile Bootstrap, che e' incluso in Cassiopeia (il tema predefinito di Joomla) e nei temi basati su Bootstrap Italia: in quel caso l'albo prende in automatico l'aspetto del tuo sito e non serve attivare nulla. Attiva questa opzione SOLO se il tuo template non include Bootstrap e l'elenco degli atti ti appare senza impaginazione (testo nudo, pulsanti che sembrano link, tabelle senza bordi). Nota: l'albo resta comunque leggibile, scaricabile e accessibile anche senza stile - cambia solo l'aspetto."
COM_ALBOONLINE_CONFIG_DEFAULT_ROBOTS="Indicizzazione motori di ricerca"
COM_ALBOONLINE_CONFIG_DEFAULT_ROBOTS_DESC="Indicizzazione predefinita degli atti in corso. Per l'albo pretorio e' consigliato 'noindex' (l'indicizzazione dai motori e' sconsigliata per il diritto all'oblio, all'opposto dell'Amministrazione Trasparente). Ogni atto in corso puo' avere un override; sugli atti archiviati il noindex e' comunque forzato."
COM_ALBOONLINE_CONFIG_REFERTO_FIELDSET="Referto di pubblicazione"
COM_ALBOONLINE_CONFIG_REFERTO_FIELDSET_DESC="Il referto attesta l'avvenuta pubblicazione di un atto all'albo. Non e' imposto da una legge nazionale: la sua disciplina (denominazione, obbligo, forma) dipende dal regolamento del singolo ente. Qui puoi attivarlo e adattarne la terminologia."
COM_ALBOONLINE_CONFIG_REFERTO_ATTIVO="Emetti il referto alla defissione"
COM_ALBOONLINE_CONFIG_REFERTO_ATTIVO_DESC="Se attivo, al termine della pubblicazione (defissione) il sistema genera automaticamente un referto in PDF congelato e sigillato, con le date effettive del periodo. Il documento resta agli atti (non e' pubblicato al cittadino)."
COM_ALBOONLINE_CONFIG_REFERTO_TITOLO="Denominazione del documento"
COM_ALBOONLINE_CONFIG_REFERTO_TITOLO_DESC="Titolo stampato in testa al documento. Lascia vuoto per usare la denominazione predefinita. Alcuni enti usano: relata di pubblicazione, attestazione di avvenuta pubblicazione, notifica di pubblicazione."
COM_ALBOONLINE_CONFIG_REFERTO_SOTTOTITOLO="Sottotitolo / riferimento regolamentare"
COM_ALBOONLINE_CONFIG_REFERTO_SOTTOTITOLO_DESC="Testo libero sotto il titolo. Puoi indicare l'articolo del tuo regolamento sull'albo pretorio. Lascia vuoto se non serve. Nota: non impostiamo un riferimento di legge predefinito perche' nessuna norma nazionale disciplina direttamente il referto."
COM_ALBOONLINE_FIELD_ROBOTS="Indicizzazione (robots)"
COM_ALBOONLINE_FIELD_ROBOTS_DESC="Controlla se i motori di ricerca indicizzano questo atto. Vuoto = usa impostazione globale del componente."
COM_ALBOONLINE_ROBOTS_USE_GLOBAL="Usa impostazione globale"
COM_ALBOONLINE_ROBOTS_INDEX_FOLLOW="Indicizza e segui link"
COM_ALBOONLINE_ROBOTS_NOINDEX_NOFOLLOW="Non indicizzare, non seguire link"
COM_ALBOONLINE_ROBOTS_NOINDEX_FOLLOW="Non indicizzare, segui link"
COM_ALBOONLINE_ROBOTS_INDEX_NOFOLLOW="Indicizza, non seguire link"
; Visibilita homepage
COM_ALBOONLINE_FIELD_VISIBILITA_HOME="Visibilita' nei moduli"
COM_ALBOONLINE_FIELD_VISIBILITA_HOME_DESC="Scegliere se mostrare questo atto nei moduli della Homepage. Le opzioni sono mutuamente esclusive."
COM_ALBOONLINE_HOME_NESSUNA="Nessuna (non mostrare in homepage)"
COM_ALBOONLINE_HOME_COMUNICAZIONI="Sezione Comunicazioni"
COM_ALBOONLINE_HOME_EVIDENZA="Sezione In Evidenza"
; Durata pubblicazione
COM_ALBOONLINE_FIELD_PUBLISH_DOWN_DESC="Data e ora di fine pubblicazione. Se lasciato vuoto, viene calcolata automaticamente aggiungendo i giorni predefiniti (configurazione componente). Per atti che devono restare visibili a lungo (es. graduatorie), impostare una data futura adeguata."
COM_ALBOONLINE_PUBLISH_DOWN_HELP="Se non compili la data di fine pubblicazione, il sistema la calcola automaticamente usando il periodo predefinito nelle Opzioni del componente. Per concorsi e graduatorie che richiedono visibilita' prolungata, imposta manualmente una data futura adeguata (anche 1-2 anni)."
