; Lavori pianificati (M37) — senza, il ciclo di vita dell'atto non avviene.
; ATTENZIONE: queste due etichette devono corrispondere ESATTAMENTE ai nomi delle routine
; come appaiono in Sistema → Attività pianificate → Nuovo (file di lingua del plugin task).
; Prima dicevano "Albo — Blindatura buffer scaduto": una voce che nella schermata NON ESISTE,
; quindi l'avviso mandava il funzionario a cercare una cosa introvabile.
COM_ALBOONLINE_TASK_LOCK="Albo Pretorio - Blocca Atti Pubblicati"
COM_ALBOONLINE_TASK_ARCHIVE="Albo Pretorio - Archivia Atti Scaduti"
COM_ALBOONLINE_WARNING_TASK_MANCANTE="Attività pianificata mancante o disattivata: «%s». Senza di essa il ciclo di vita degli atti non avviene: gli atti pubblicati non diventano mai visibili al cittadino (blindatura), oppure non vengono mai ritirati alla scadenza e nessun referto viene emesso (archiviazione). Creala in Sistema → Attività pianificate → Nuovo, scegliendo il tipo di attività con quel nome."
COM_ALBOONLINE_TASK_CREATI="Attività pianificate create automaticamente: «%s». Sono i lavori che rendono pubblici gli atti alla scadenza del buffer e li ritirano a fine periodo emettendo il referto. Le trovi in Sistema → Attività pianificate. ATTENZIONE: perché partano davvero, il sito deve avere un modo per eseguirle. Con lo «scheduler pigro» (impostazione predefinita di Joomla) partono solo quando qualcuno visita il sito: su un albo poco visitato un atto può restare «In attesa» per ore. Per un albo pretorio è consigliato un cron di sistema."
COM_ALBOONLINE_TASK_CREAZIONE_FALLITA="Non è stato possibile creare automaticamente l'attività pianificata «%s». Il componente funziona lo stesso, ma finché quel lavoro non esiste gli atti non completano il loro ciclo. Crealo a mano in Sistema → Attività pianificate → Nuovo."

; Spiegazioni dei campi: solo dove sbagliare ha una conseguenza (una descrizione su ogni campo
; sarebbe rumore, e nessuno leggerebbe più quelle che contano)
COM_ALBOONLINE_FIELD_OGGETTO_DESC="Sintesi del contenuto dell'atto. È pubblica: la legge il cittadino nell'elenco dell'albo. È anche il testo su cui il sistema cerca i termini che indicano dati particolari (salute, giudiziari, minori) per avvisarti prima della pubblicazione."
COM_ALBOONLINE_FIELD_CATEGORY_DESC="Serve solo a CLASSIFICARE l'atto e a farlo trovare nell'albero delle categorie. NON limita chi può vederlo: un atto pubblicato all'albo è consultabile da chiunque, anche se la categoria è riservata. Se un contenuto non deve essere pubblico, non va pubblicato all'albo."
COM_ALBOONLINE_FIELD_TIPO_ATTO_DESC="Determina la DURATA della pubblicazione: ogni tipologia ha i suoi giorni, configurati nelle Opzioni. La durata è un minimo di legge — si può pubblicare più a lungo, mai meno."
COM_ALBOONLINE_FIELD_RESPONSABILE_DESC="Chi risponde della pubblicazione. Viene stampato sul referto e sul registro: è il nome che l'ente esibisce se qualcuno contesta quando e per quanto l'atto è stato pubblicato."
COM_ALBOONLINE_FIELD_DATA_ATTO_DESC="La data del PROVVEDIMENTO (quella scritta sull'atto), non quella di pubblicazione. Le due sono diverse: la pubblicazione inizia quando premi «Pubblica»."
COM_ALBOONLINE_FIELD_PUBLISH_UP_DESC="Data certa di inizio pubblicazione: da qui decorrono i termini di impugnazione del cittadino. La fissa il sistema quando pubblichi — non è modificabile a mano, ed è per questo che vale come prova."
COM_ALBOONLINE_CONFIG_HELPURL="Indirizzo della guida (pulsante Aiuto)"
COM_ALBOONLINE_CONFIG_HELPURL_DESC="Il pulsante «Aiuto» della toolbar è di Joomla e, di fabbrica, apre la guida in linea di Joomla — poco utile a chi pubblica atti. Indicando qui un indirizzo (la guida dell'ente o quella del componente), il pulsante aprirà quello. Lascia vuoto se non hai una guida: meglio un aiuto generico che un link rotto."
