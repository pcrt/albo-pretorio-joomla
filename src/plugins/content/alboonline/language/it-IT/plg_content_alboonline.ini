PLG_CONTENT_ALBOONLINE_ERROR_CATEGORIA_CON_ATTI_1="Impossibile cancellare la categoria: contiene 1 atto dell'Albo Pretorio. Cancellandola, l'atto resterebbe senza classificazione, e su un atto gia' pubblicato il dato non sarebbe piu' recuperabile dall'interfaccia. Sposta prima l'atto in un'altra categoria."
PLG_CONTENT_ALBOONLINE_ERROR_CATEGORIA_CON_ATTI_MORE="Impossibile cancellare la categoria: contiene %d atti dell'Albo Pretorio. Cancellandola, gli atti resterebbero senza classificazione, e su quelli gia' pubblicati il dato non sarebbe piu' recuperabile dall'interfaccia. Spostali prima in un'altra categoria."
PLG_CONTENT_ALBOONLINE_CAT_TITLE_DESC="Il nome che il cittadino vedrà nell'albero delle categorie dell'albo, sul sito pubblico."
PLG_CONTENT_ALBOONLINE_CAT_ACCESS_DESC="ATTENZIONE: il livello di accesso NON limita chi può vedere gli atti contenuti in questa categoria. Se lo restringi, la categoria sparisce dalla navigazione del sito, ma i suoi atti restano consultabili da chiunque — perché un atto pubblicato all'albo dev'essere accessibile senza autenticazione (art. 32 L. 69/2009). Se un contenuto non deve essere pubblico, non va pubblicato all'albo."
PLG_CONTENT_ALBOONLINE_CAT_PUBLISHED_DESC="Sospendere una categoria la nasconde dalla navigazione del sito, ma NON ritira gli atti che contiene: restano pubblicati e i termini continuano a decorrere. Un atto si ritira solo alla scadenza (defissione) o con il diritto all'oblio."
