PLG_CONTENT_ALBOONLINE_ERROR_CATEGORIA_CON_ATTI_1="Cannot delete this category: it contains 1 act of the Legal Notice Board. Deleting it would leave the act without a classification, and on an already published act that data could no longer be restored from the interface. Move the act to another category first."
PLG_CONTENT_ALBOONLINE_ERROR_CATEGORIA_CON_ATTI_MORE="Cannot delete this category: it contains %d acts of the Legal Notice Board. Deleting it would leave the acts without a classification, and on those already published that data could no longer be restored from the interface. Move them to another category first."
PLG_CONTENT_ALBOONLINE_CAT_TITLE_DESC="The name citizens will see in the notice board's category tree on the public site."
PLG_CONTENT_ALBOONLINE_CAT_ACCESS_DESC="WARNING: the access level does NOT restrict who can see the acts in this category. If you restrict it, the category disappears from the site navigation, but its acts remain readable by anyone — because an act published on the notice board must be accessible without authentication. If a content must not be public, it must not be published on the notice board."
PLG_CONTENT_ALBOONLINE_CAT_PUBLISHED_DESC="Unpublishing a category hides it from the site navigation, but does NOT withdraw the acts it contains: they stay published and the legal terms keep running. An act is withdrawn only at expiry or through the right to be forgotten."
