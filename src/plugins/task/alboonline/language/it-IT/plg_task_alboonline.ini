PLG_TASK_ALBOONLINE="Task - Albo Pretorio Online"
PLG_TASK_ALBOONLINE_XML_DESCRIPTION="Attivita' pianificate per l'Albo Pretorio Online: blocco automatico degli atti dopo la scadenza del buffer e archiviazione automatica al termine del periodo di pubblicazione."

; Routine di blocco
PLG_TASK_ALBOONLINE_LOCK_TITLE="Albo Pretorio - Blocca Atti Pubblicati"
PLG_TASK_ALBOONLINE_LOCK_DESC="Blocca gli atti il cui periodo di buffer e' scaduto, rendendoli immodificabili. Consigliato: ogni 5 minuti."
PLG_TASK_ALBOONLINE_LOCK_NOTE_LABEL="Blocco Buffer Scaduto"
PLG_TASK_ALBOONLINE_LOCK_NOTE_DESC="Questa attivita' trova gli atti in stato 'In Attesa' il cui periodo di buffer e' scaduto e li transiziona a 'Pubblicato' (bloccato). L'hash del file viene calcolato e memorizzato per la verifica di integrita'."

; Routine di archiviazione
PLG_TASK_ALBOONLINE_ARCHIVE_TITLE="Albo Pretorio - Archivia Atti Scaduti"
PLG_TASK_ALBOONLINE_ARCHIVE_DESC="Archivia gli atti il cui periodo di pubblicazione e' terminato. Consigliato: ogni 15 minuti."
PLG_TASK_ALBOONLINE_ARCHIVE_NOTE_LABEL="Archivia Atti Scaduti"
PLG_TASK_ALBOONLINE_ARCHIVE_NOTE_DESC="Questa attivita' trova gli atti pubblicati la cui data di scadenza (publish_down) e' passata e li transiziona allo stato 'Archiviato'."
