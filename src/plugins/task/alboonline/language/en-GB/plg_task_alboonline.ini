PLG_TASK_ALBOONLINE="Task - Albo Pretorio Online"
PLG_TASK_ALBOONLINE_XML_DESCRIPTION="Scheduled tasks for Albo Pretorio Online: automatic locking of acts after buffer expiry and automatic archiving after publication period ends."

; Lock routine
PLG_TASK_ALBOONLINE_LOCK_TITLE="Albo Pretorio - Lock Published Acts"
PLG_TASK_ALBOONLINE_LOCK_DESC="Locks acts whose buffer period has expired, making them immutable. Recommended: every 5 minutes."
PLG_TASK_ALBOONLINE_LOCK_NOTE_LABEL="Lock Expired Buffer"
PLG_TASK_ALBOONLINE_LOCK_NOTE_DESC="This task finds acts in 'Pending' state whose buffer period has expired and transitions them to 'Published' (locked). The file hash is computed and stored for integrity verification."

; Archive routine
PLG_TASK_ALBOONLINE_ARCHIVE_TITLE="Albo Pretorio - Archive Expired Acts"
PLG_TASK_ALBOONLINE_ARCHIVE_DESC="Archives acts whose publication period has ended. Recommended: every 15 minutes."
PLG_TASK_ALBOONLINE_ARCHIVE_NOTE_LABEL="Archive Expired Acts"
PLG_TASK_ALBOONLINE_ARCHIVE_NOTE_DESC="This task finds published acts whose publish_down date has passed and transitions them to 'Archived' state."
